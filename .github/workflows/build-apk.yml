name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'release' }}
        run: flutter build apk --release

      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'release' }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
